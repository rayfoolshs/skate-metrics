[project]
name = "skate-metrics"
version = "0.1.0"
description = "Markerless figure-skating jump analysis from video"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ray Foo Productions" }]

[project.urls]
Homepage = "https://www.rayfooproductions.com"
Instagram = "https://www.instagram.com/edgeswithray/"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
]

[project.optional-dependencies]
pose = ["mediapipe>=0.10.14"]
yolo = ["ultralytics>=8.3"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "yt-dlp>=2025.1.1",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
skate-metrics = "skatemetrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skatemetrics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
